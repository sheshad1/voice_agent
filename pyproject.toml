[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rider-agent"
version = "0.1.0"
description = "Swiggy rider onboarding voice agent on Sarvam: booking, CRM, dialer and ops dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
rider-agent = "rider_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
